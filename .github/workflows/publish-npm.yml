name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 1.0.0，不带 v 前缀）'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Sync version from tag
        if: github.event_name == 'push'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Publishing version: $VERSION"

      - name: Sync version from manual input
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ inputs.tag }} --no-git-tag-version --allow-same-version
          echo "Publishing version: ${{ inputs.tag }}"

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
